{% extends 'base.html' %}
{% load static %}

{% block extra_css %}

{% endblock %}

{% block content %}
<div class="order-confirmation">
    <h2>Спасибо за ваш заказ!</h2>

    <a href="{% url 'shop:shop_catalog' %}" class="btn-primary">Продолжить покупки</a>
</div>
{% endblock %}
